<header class="hero" id="topo" data-screen-label="Hero">
  <div class="aurora-glow g1"></div>
  <div class="aurora-glow g2"></div>
  <div class="hero-sun" data-parallax="0.12"></div>

  <!-- Fumaça WebGL -->
  <canvas class="smoke-gl" aria-hidden="true"></canvas>

  <div class="wrap hero-grid">
    <div class="hero-copy">
      <span class="eyebrow">Cafeteria de cafés especiais</span>
      <h1 class="reveal" style="--d:120ms">Desperte seus <span class="aurora-text">melhores momentos.</span></h1>
      <p class="hero-sub reveal-fade" style="--d:600ms">
        Um refúgio urbano para começar o dia com calma. Aqui o café
        não é apenas uma bebida — <em>é um ritual.</em>
      </p>
      <div class="hero-actions reveal-fade" style="--d:800ms">
        <a href="#cardapio" class="btn btn-primary">Ver o cardápio <span class="arr">→</span></a>
        <a href="#manifesto" class="btn btn-ghost">Nossa história</a>
      </div>
    </div>

    <div class="hero-media reveal-fade" style="--d:400ms">
      <div class="hero-frame" data-parallax="-0.04">
        <img src="/img/01-hero.png" alt="Xícara de café com latte art ao amanhecer" loading="eager">
      </div>
      <div class="float-note">"A primeira luz da manhã, em uma xícara."</div>
    </div>
  </div>

  <div class="scroll-cue"><span class="bar"></span> Role para descobrir</div>
</header>
